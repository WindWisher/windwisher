[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://supabase.com"
additional_redirect_urls = ["windwisher://login-callback"]
jwt_expiry = 3600

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.forecast-proxy]
verify_jwt = false

[functions.spot-alarm-runner]
verify_jwt = false
